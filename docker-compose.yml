services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      # Vi mounter hele backend-mappen til en data-folder i containeren
      # Dette tillader containeren at oprette users.json hvis den mangler
      - ./backend:/app/backend_data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # Dette gør at du kan redigere kode live (Hot Reload)
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Nødvendig for at Hot Reload virker stabilt i WSL2
      - CHOKIDAR_USEPOLLING=true
      # Fortæl Vite at backenden hedder "backend" herinde
      - PROXY_TARGET=http://backend:8080
    depends_on:
      - backend
